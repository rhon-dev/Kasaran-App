name: CI

# Runs on every push to any branch and on every pull-request targeting main.
# iOS builds are deliberately excluded from PR CI — they run only on tagged
# release candidates and nightly, per deployment-plan §3.2 cost policy.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter version pinned to the same channel used by the dev machine.
  # Update this when the team upgrades Flutter.
  FLUTTER_VERSION: '3.41.6'

# ---------------------------------------------------------------------------
# Job: analyze
# Runs `flutter analyze` with strict settings from analysis_options.yaml.
# A single lint violation (including the gate test in task 9) fails this job.
# ---------------------------------------------------------------------------
jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

# ---------------------------------------------------------------------------
# Job: test
# Runs the full unit-test suite. Requires at least one test to produce a
# meaningful non-zero exit on failure (placeholder_test.dart satisfies this
# at phase 01; domain tests are added progressively from phase 02 onward).
# ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter=expanded

# ---------------------------------------------------------------------------
# Job: build-android
# Builds a debug App Bundle (.aab) on a Linux runner.
# Build number = github.run_number, satisfying deployment-plan §3.3:
#   iOS CFBundleVersion == Android versionCode == CI run number.
# iOS build is EXCLUDED per deployment-plan §3.2 (macOS runner cost policy).
# ---------------------------------------------------------------------------
  build-android:
    name: Build Android (debug AAB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Build number from CI run number (deployment-plan §3.3).
      # --build-number is applied identically to CFBundleVersion (iOS) and
      # versionCode (Android); for the Android debug build here the run number
      # is set even in debug mode so the produced artifact is identifiable.
      - name: Build Android App Bundle (debug)
        run: |
          flutter build appbundle \
            --debug \
            --build-number=${{ github.run_number }} \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

      - name: Verify AAB exists
        run: |
          AAB=build/app/outputs/bundle/debug/app-debug.aab
          if [ ! -f "$AAB" ]; then
            echo "ERROR: App Bundle not found at $AAB"
            exit 1
          fi
          echo "AAB produced: $AAB ($(du -sh "$AAB" | cut -f1))"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}.aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 14
