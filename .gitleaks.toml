# Extend stock rules; allow only the public, deterministic local Supabase demo JWT.
# Historical secret_probe.txt is handled by its exact immutable finding fingerprint
# in the CI scan, never by a broad path/commit allowlist.
[extend]
useDefault = true

[[allowlists]]
description = "Deterministic local Supabase demo anon JWT only (not staging/production)"
condition = "AND"
paths = ['^(?:\.env\.example|lib/config/app_config\.dart)$']
regexes = ['^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0$']
